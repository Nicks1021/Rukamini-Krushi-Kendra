
<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>नवीन श्रेणी जोडा - रुक्मिणी कृषी केंद्र</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f0fdf4;
            font-family: "Noto Sans Devanagari", Arial, sans-serif;
        }

        .navbar {
            background: #14532d;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .form-box {
            max-width: 600px;
            margin: 70px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        .title {
            color: #14532d;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">

    <div class="container">

        <span class="navbar-brand">
            🌾 रुक्मिणी कृषी केंद्र
        </span>

        <a
            href="{% url 'dashboard' %}"
            class="btn btn-light"
        >
            Dashboard
        </a>

    </div>

</nav>


<div class="container">

    <div class="form-box">

        <h2 class="title text-center mb-4">
            📂 नवीन श्रेणी जोडा
        </h2>

        <p class="text-center text-muted mb-4">
            Website साठी नवीन उत्पादन श्रेणी तयार करा.
        </p>


        <form method="POST">

            {% csrf_token %}


            <div class="mb-4">

                <label class="form-label">
                    श्रेणीचे नाव
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="उदा. बियाणे, खते, कीटकनाशके"
                    required
                >

            </div>


            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    ✅ श्रेणी जतन करा
                </button>


                <a
                    href="{% url 'dashboard' %}"
                    class="btn btn-secondary"
                >
                    ❌ Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
