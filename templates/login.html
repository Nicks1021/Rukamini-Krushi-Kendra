
<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Shop Owner Login - रुक्मिणी कृषी केंद्र</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f0fdf4;
            font-family: "Noto Sans Devanagari", Arial, sans-serif;
        }

        .login-box {
            max-width: 420px;
            margin: 100px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        .login-title {
            color: #14532d;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="login-box">

        <h2 class="text-center login-title mb-4">
            🌾 Shop Owner Login
        </h2>

        <p class="text-center text-muted">
            रुक्मिणी कृषी केंद्र
        </p>

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Username टाका"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Password टाका"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn btn-success w-100"
            >
                🔐 Login
            </button>

        </form>

        <div class="text-center mt-4">
            <a href="/" class="text-success">
                ← Website वर परत जा
            </a>
        </div>

    </div>

</div>

</body>
</html>
