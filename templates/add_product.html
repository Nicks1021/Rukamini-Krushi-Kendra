
<!DOCTYPE html>
<html lang="mr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>नवीन उत्पादन जोडा - रुक्मिणी कृषी केंद्र</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f0fdf4;
            font-family: "Noto Sans Devanagari", Arial, sans-serif;
        }

        .navbar {
            background: #14532d;
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .form-box {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        .title {
            color: #14532d;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">

        <span class="navbar-brand">
            🌾 रुक्मिणी कृषी केंद्र
        </span>

        <a
            href="{% url 'dashboard' %}"
            class="btn btn-light"
        >
            Dashboard
        </a>

    </div>
</nav>


<div class="container">

    <div class="form-box">

        <h2 class="title text-center mb-4">
            ➕ नवीन उत्पादन जोडा
        </h2>


        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <!-- PRODUCT NAME -->

            <div class="mb-3">

                <label class="form-label">
                    उत्पादनाचे नाव
                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="उदा. मका बियाणे"
                    required
                >

            </div>


            <!-- CATEGORY -->

            <div class="mb-3">

                <label class="form-label">
                    श्रेणी
                </label>

                <select
                    name="category"
                    class="form-select"
                    required
                >

                    <option value="">
                        -- श्रेणी निवडा --
                    </option>

                    {% for category in categories %}

                    <option value="{{ category.id }}">
                        {{ category.name }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- DESCRIPTION -->

            <div class="mb-3">

                <label class="form-label">
                    उत्पादनाचे वर्णन
                </label>

                <textarea
                    name="description"
                    class="form-control"
                    rows="4"
                    placeholder="उत्पादनाबद्दल थोडक्यात माहिती द्या"
                ></textarea>

            </div>


            <!-- PRICE -->

            <div class="mb-3">

                <label class="form-label">
                    किंमत (₹)
                </label>

                <input
                    type="number"
                    name="price"
                    class="form-control"
                    step="0.01"
                    min="0"
                    placeholder="उदा. 250"
                    required
                >

            </div>


            <!-- STOCK -->

            <div class="mb-3">

                <label class="form-label">
                    साठा
                </label>

                <input
                    type="number"
                    name="stock"
                    class="form-control"
                    min="0"
                    placeholder="उदा. 50"
                    required
                >

            </div>


            <!-- IMAGE -->

            <div class="mb-4">

                <label class="form-label">
                    उत्पादनाचा फोटो
                </label>

                <input
                    type="file"
                    name="image"
                    class="form-control"
                    accept="image/*"
                >

            </div>


            <!-- BUTTONS -->

            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    ✅ उत्पादन जतन करा
                </button>

                <a
                    href="{% url 'dashboard' %}"
                    class="btn btn-secondary"
                >
                    ❌ Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
